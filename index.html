<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CelerySync" />
    <meta name="theme-color" content="#3D6B44" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- SEO — claims are a regulated surface (see LEGAL_CONSTRAINTS.md):
         descriptive wellness framing only, no protocol/condition language -->
    <title>CelerySync — Your Daily Wellness Companion</title>
    <meta name="description" content="A daily rhythm and reminder companion for the wellness routine you choose to follow. Voice companion, daily check-ins, streaks, and your own trends. Independent app." />
    <meta name="keywords" content="celery juice, wellness routine, daily rhythm, habit tracking, wellness companion, reminders, wellbeing" />
    <meta name="author" content="CelerySync" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CelerySync — Your Daily Wellness Companion" />
    <meta property="og:description" content="Reminders, daily rhythm, and a voice companion for the wellness routine you choose to follow. Your routine, your data, your trends." />
    <meta property="og:image" content="/icons/icon-512.svg" />
    <meta property="og:site_name" content="CelerySync" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="CelerySync — Your Daily Wellness Companion" />
    <meta name="twitter:description" content="Reminders, daily rhythm, and a voice companion for the wellness routine you choose to follow. Independent app." />
    <meta name="twitter:image" content="/icons/icon-512.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dev-only guard, runs before any module loads: a service worker left
      // over from a past production-mode run on localhost cache-first-serves
      // stale /src modules and blanks the page. Classic inline script so it
      // executes even when the module graph is broken.
      (function () {
        var h = location.hostname;
        var isDevHost = h === "localhost" || h === "127.0.0.1" || /^192\.168\./.test(h) || /^10\./.test(h);
        if (!isDevHost || !("serviceWorker" in navigator)) return;
        if (sessionStorage.getItem("cs_sw_cleaned")) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          Promise.all(regs.map(function (r) { return r.unregister(); }))
            .then(function () { return ("caches" in window) ? caches.keys() : []; })
            .then(function (keys) { return Promise.all(keys.map(function (k) { return caches.delete(k); })); })
            .then(function () {
              sessionStorage.setItem("cs_sw_cleaned", "1");
              location.reload();
            });
        }).catch(function () {});
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
