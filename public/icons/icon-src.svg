<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#3D6B44"/>
  <!-- Celery stalk -->
  <rect x="90" y="110" width="12" height="58" rx="6" fill="#6aad72"/>
  <!-- Leaf left -->
  <ellipse cx="72" cy="90" rx="28" ry="14" fill="#6aad72" transform="rotate(-40 72 90)"/>
  <!-- Leaf right -->
  <ellipse cx="120" cy="90" rx="28" ry="14" fill="#8dc77d" transform="rotate(40 120 90)"/>
  <!-- Leaf center -->
  <ellipse cx="96" cy="74" rx="22" ry="34" fill="#8dc77d"/>
  <!-- Vein center -->
  <line x1="96" y1="50" x2="96" y2="112" stroke="#3D6B44" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Vein left -->
  <line x1="96" y1="65" x2="78" y2="80" stroke="#3D6B44" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="78" x2="78" y2="92" stroke="#3D6B44" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Vein right -->
  <line x1="96" y1="65" x2="114" y2="80" stroke="#3D6B44" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="96" y1="78" x2="114" y2="92" stroke="#3D6B44" stroke-width="1.5" stroke-linecap="round"/>
</svg>
